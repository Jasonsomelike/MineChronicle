name: verify

# Runs the same gate developers run locally: `npm run verify`.
# The project is Windows-only (Tauri + windows-sys + WebView2), so the job runs
# on windows-latest. No WebView2 or MSVC GUI toolchain is needed for these
# checks: the Rust tests use Tauri's mock runtime, and the frontend tests are
# pure logic (no DOM), so no browser is launched.
#
# Note: the test suite shells out to `pwsh` (PowerShell 7+) to create directory
# junctions; windows-latest provides it. See tests/support/mod.rs.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep Cargo's memory peak down on Windows runners; matches the README.
  CARGO_BUILD_JOBS: '1'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # TypeScript, ESLint, Vitest, Prettier, rustfmt, Clippy, Rust tests.
      - name: Run the full gate
        run: npm run verify

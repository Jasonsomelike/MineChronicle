[package]
name = "minechronicle"
version = "0.10.23"
description = "Offline Minecraft career statistics"
edition = "2021"
rust-version = "1.97"

[lib]
name = "minechronicle_lib"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
fastnbt = "2.6"
flate2 = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"
walkdir = "2"
notify = "8.2"
blake3 = "1.8"
rusqlite = { version = "0.38", features = ["bundled", "trace", "backup"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
